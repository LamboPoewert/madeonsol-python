[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "madeonsol-x402"
version = "0.1.0"
description = "x402 client SDK for MadeOnSol Solana KOL intelligence API. Works with LangChain, CrewAI, and standalone."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["solana", "x402", "kol", "trading", "api", "langchain", "crewai", "ai-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "httpx>=0.27",
    "x402[svm,httpx]>=0.1",
]

[project.optional-dependencies]
langchain = ["langchain-core>=0.3"]
crewai = ["crewai>=0.80"]

[project.urls]
Homepage = "https://madeonsol.com/solana-api"
Repository = "https://github.com/LamboPoewert/madeonsol-python"
